<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabForge</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <nav id="topnav" aria-label="Main">
      <a href="#/" class="brand" data-route="landing" aria-label="LabForge home">
        <svg class="logo-mark" viewBox="0 0 16 16" width="28" height="28" aria-hidden="true" shape-rendering="crispEdges">
          <rect x="6" y="1" width="4" height="1" fill="#1b1f24"/><rect x="6" y="2" width="1" height="4" fill="#1b1f24"/><rect x="9" y="2" width="1" height="4" fill="#1b1f24"/>
          <rect x="7" y="2" width="2" height="4" fill="#e9f7ff"/>
          <rect x="5" y="6" width="1" height="2" fill="#1b1f24"/><rect x="10" y="6" width="1" height="2" fill="#1b1f24"/>
          <rect x="4" y="8" width="1" height="2" fill="#1b1f24"/><rect x="11" y="8" width="1" height="2" fill="#1b1f24"/>
          <rect x="3" y="10" width="1" height="4" fill="#1b1f24"/><rect x="12" y="10" width="1" height="4" fill="#1b1f24"/><rect x="3" y="14" width="10" height="1" fill="#1b1f24"/>
          <rect x="6" y="6" width="4" height="2" fill="#e9f7ff"/><rect x="5" y="8" width="6" height="2" fill="#3ee07a"/><rect x="4" y="10" width="8" height="4" fill="#3ee07a"/>
          <rect x="5" y="11" width="1" height="1" fill="#b6ffd2"/><rect x="8" y="12" width="1" height="1" fill="#b6ffd2"/><rect x="10" y="10" width="1" height="1" fill="#b6ffd2"/>
        </svg><span class="logo-word">LabForge</span></a>
      <a href="#/cases" data-route="cases">Case studies</a>
      <a href="#/case/chem" data-route="case/chem">Chemistry case</a>
      <a href="#/case/fbdd" data-route="case/fbdd">XChem case</a>
      <a href="#/design" data-route="design">Design your own</a>
      <a href="#/bench" data-route="bench">Bench</a>
      <a href="#/validation" data-route="validation">Validation</a>
      <a href="#/schedule" data-route="schedule">Schedule</a>
      <a href="#/protocols" data-route="protocols">Protocols</a>
    </nav>
    <section id="landing" class="hidden" aria-label="Start"></section>
    <main id="app">
    <div id="game">
      <div id="brief" class="frame hidden" aria-label="Case brief"></div>
      <div id="statcard" class="frame hidden"></div>
      <div id="clockbar" class="frame hidden">
        <div class="controls">
          <button id="play" title="Play / pause (P)">❚❚</button>
          <select id="speed" title="Sim seconds per real second">
            <option value="1">1×</option><option value="60">60×</option><option value="300" selected>300×</option>
            <option value="1800">1800×</option><option value="3600">3600×</option>
          </select>
          <span id="clock-t" title="Simulated time: day into the run, then hours:minutes:seconds">Day 1, 00:00:00</span>
        </div>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Sim time" />
        <div class="stats"><span id="clock-done"></span><span id="clock-src"></span></div>
      </div>
      <div id="replay-badge" class="hidden" title="This is a recording of an earlier agent run, played back without calling the backend."><span class="dot"></span><span class="text">Replay of a recorded run</span></div>
      <div id="agent-banner" class="hidden" role="status"></div>
      <div id="modal" class="frame hidden" role="dialog" aria-modal="true"></div>
      <div id="viz-tip" class="hidden"></div>
      <div id="dialogue" class="frame hidden"><div class="speaker">LABFORGE</div><div class="text"></div><span class="caret">▼</span></div>
    </div>
    <aside id="panel">
      <section id="metrics"></section>
      <section id="checked" class="hidden"></section>
      <section id="fix" class="hidden"></section>
      <section id="verdicts" class="hidden"></section>
      <section id="bom"></section>
      <section id="protocols-for" class="hidden"></section>
      <section id="chat">
        <div id="log"></div>
        <form id="chat-form"><input id="chat-input" placeholder="Describe your lab..." /><button>Send</button></form>
      </section>
      <button id="whatif-btn" class="hidden"></button>
      <div id="report-row"><button id="report-btn" title="Printable report: BOM, layout, throughput with uncertainty, risks and unknowns">Report</button><button id="skill-btn" class="hidden" title="SKILL.md and tools.json: run this lab with an agent">Download agent skill</button></div>
    </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
