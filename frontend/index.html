<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabForge</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game">
      <div id="statcard" class="frame hidden"></div>
      <div id="clockbar" class="frame hidden">
        <div class="controls">
          <button id="play" title="Play / pause (P)">❚❚</button>
          <select id="speed" title="Sim seconds per real second">
            <option value="1">1×</option><option value="60">60×</option><option value="300" selected>300×</option>
            <option value="1800">1800×</option><option value="3600">3600×</option>
          </select>
          <span id="clock-t">T+00:00:00</span>
        </div>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Sim time" />
        <div class="stats"><span id="clock-done"></span><span id="clock-src"></span></div>
      </div>
      <div id="dialogue" class="frame hidden"><div class="speaker">LABFORGE</div><div class="text"></div><span class="caret">▼</span></div>
    </div>
    <aside id="panel">
      <h1>LabForge</h1>
      <section id="metrics"></section>
      <section id="bom"></section>
      <section id="chat">
        <div id="log"></div>
        <form id="chat-form"><input id="chat-input" placeholder="Describe your lab..." /><button>Send</button></form>
      </section>
      <button id="report-btn">Report for your boss</button>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
