[project]
name = "labforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "simpy>=4.1",
  "jsonschema>=4.21",
  "anthropic>=0.40",
  "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
modal = ["modal"]

[tool.setuptools.packages.find]
include = ["labforge*"]

[tool.setuptools.package-data]
labforge = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "labforge/agent"]
